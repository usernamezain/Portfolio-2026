<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#111111" />
  <!-- Grid overlay -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />
  
  <circle cx="950" cy="200" r="280" fill="#2563eb" opacity="0.15" filter="blur(80px)" />
  <circle cx="300" cy="450" r="220" fill="#7c3aed" opacity="0.12" filter="blur(80px)" />

  <!-- Content Box -->
  <g transform="translate(100, 140)">
    <rect width="140" height="34" rx="17" fill="rgba(110, 168, 254, 0.12)" stroke="rgba(110, 168, 254, 0.3)" />
    <text x="70" y="22" font-family="monospace" font-size="14" font-weight="600" fill="#6ea8fe" text-anchor="middle">zaindev.me</text>

    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Zain Ali Mughal
    </text>

    <text x="0" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#a3a3a3">
      Creative Developer &amp; Senior Frontend Engineer
    </text>

    <text x="0" y="240" font-family="monospace" font-size="18" fill="#6ea8fe">
      Astro • GSAP • Anime.js • Lenis • Three.js • 100/100 Core Web Vitals
    </text>
  </g>
</svg>

