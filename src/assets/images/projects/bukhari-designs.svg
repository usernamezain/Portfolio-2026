<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="bkBg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="bkGrad" x1="50" y1="50" x2="550" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="600" height="340" rx="12" fill="url(#bkBg)" />

  <!-- Agency Editorial Layout Mockup -->
  <g transform="translate(60, 45)">
    <!-- Main Agency Header -->
    <rect width="130" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" />
    <text x="65" y="15" font-family="monospace" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">DESIGN AGENCY</text>

    <text x="0" y="65" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
      Bukhari Designers
    </text>
    <text x="0" y="92" font-family="system-ui, sans-serif" font-size="13" fill="#a1a1aa">
      Worldwide UI/UX &amp; Graphic Design Agency. React &amp; TypeScript.
    </text>

    <!-- Editorial Gallery Grid -->
    <g transform="translate(0, 120)">
      <rect width="230" height="120" rx="8" fill="#27272a" stroke="rgba(255,255,255,0.06)" />
      <rect x="20" y="20" width="190" height="60" rx="6" fill="#18181b" />
      <circle cx="50" cy="50" r="16" fill="url(#bkGrad)" />
      <rect x="80" y="44" width="110" height="8" rx="3" fill="#e4e4e7" />
      <rect x="80" y="58" width="70" height="6" rx="3" fill="#71717a" />
      <rect x="20" y="92" width="100" height="14" rx="4" fill="#3f3f46" />

      <rect x="250" y="0" width="230" height="120" rx="8" fill="#27272a" stroke="rgba(255,255,255,0.06)" />
      <rect x="270" y="20" width="190" height="60" rx="6" fill="#18181b" />
      <circle cx="300" cy="50" r="16" fill="#06b6d4" />
      <rect x="330" y="44" width="110" height="8" rx="3" fill="#e4e4e7" />
      <rect x="330" y="58" width="70" height="6" rx="3" fill="#71717a" />
      <rect x="270" y="92" width="100" height="14" rx="4" fill="#3f3f46" />
    </g>
  </g>
</svg>

