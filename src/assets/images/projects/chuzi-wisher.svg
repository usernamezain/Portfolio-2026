<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="cwBg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cwGrad" x1="50" y1="50" x2="550" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <rect width="600" height="340" rx="12" fill="url(#cwBg)" />

  <!-- Confetti / Floating Sparkles -->
  <circle cx="100" cy="60" r="4" fill="#fbbf24" />
  <circle cx="480" cy="80" r="5" fill="#38bdf8" />
  <circle cx="520" cy="240" r="4" fill="#a855f7" />
  <circle cx="80" cy="260" r="5" fill="#34d399" />
  <rect x="220" y="45" width="8" height="8" rx="2" fill="#f43f5e" transform="rotate(25 220 45)" />
  <rect x="420" y="270" width="10" height="10" rx="2" fill="#fbbf24" transform="rotate(45 420 270)" />

  <!-- Greeting Card Window -->
  <g transform="translate(130, 65)">
    <rect width="340" height="210" rx="14" fill="#2e1065" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1.5" />
    <!-- Heart / Wish Icon -->
    <circle cx="170" cy="65" r="28" fill="url(#cwGrad)" />
    <path d="M170 80 L160 68 C155 62 162 52 170 60 C178 52 185 62 180 68 Z" fill="#ffffff" />

    <text x="170" y="125" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#fdf2f8" text-anchor="middle">
      Chuzi Wisher
    </text>
    <text x="170" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#fbcfe8" text-anchor="middle">
      Animated Birthday &amp; Celebration Wishes
    </text>

    <rect x="95" y="170" width="150" height="24" rx="12" fill="#f43f5e" opacity="0.9" />
    <text x="170" y="186" font-family="monospace" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">SEND CELEBRATION ↗</text>
  </g>
</svg>

