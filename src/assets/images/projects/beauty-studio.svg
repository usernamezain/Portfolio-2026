<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="bsBg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="bsGold" x1="50" y1="50" x2="550" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="600" height="340" rx="12" fill="url(#bsBg)" />

  <!-- Studio Frame Layout -->
  <rect x="40" y="36" width="520" height="268" rx="8" fill="#292524" stroke="rgba(234, 179, 8, 0.2)" stroke-width="1" />
  
  <!-- Studio Content -->
  <g transform="translate(70, 75)">
    <rect width="130" height="22" rx="11" fill="rgba(234, 179, 8, 0.12)" stroke="rgba(234, 179, 8, 0.3)" />
    <text x="65" y="15" font-family="monospace" font-size="10" font-weight="600" fill="#facc15" text-anchor="middle">LUXURY SALON</text>

    <text x="0" y="65" font-family="system-ui, serif" font-size="26" font-weight="600" fill="#fef08a" letter-spacing="0.5">
      Beauty Studio by Aqsa
    </text>
    <text x="0" y="94" font-family="system-ui, sans-serif" font-size="13" fill="#d6d3d1">
      Smooth responsive choreography and Vue 3 + Anime.js micro-motion.
    </text>

    <!-- Decorative Cosmetic / Salon Cards -->
    <g transform="translate(0, 125)">
      <rect width="140" height="70" rx="6" fill="#1c1917" stroke="rgba(255,255,255,0.08)" />
      <rect x="15" y="15" width="80" height="10" rx="3" fill="#fde047" opacity="0.8" />
      <rect x="15" y="32" width="110" height="6" rx="3" fill="#78716c" />
      <rect x="15" y="44" width="70" height="6" rx="3" fill="#78716c" opacity="0.6" />

      <rect x="155" y="0" width="140" height="70" rx="6" fill="#1c1917" stroke="rgba(255,255,255,0.08)" />
      <rect x="170" y="15" width="80" height="10" rx="3" fill="#fde047" opacity="0.8" />
      <rect x="170" y="32" width="110" height="6" rx="3" fill="#78716c" />
      <rect x="170" y="44" width="70" height="6" rx="3" fill="#78716c" opacity="0.6" />

      <rect x="310" y="0" width="140" height="70" rx="6" fill="#1c1917" stroke="rgba(255,255,255,0.08)" />
      <rect x="325" y="15" width="80" height="10" rx="3" fill="#fde047" opacity="0.8" />
      <rect x="325" y="32" width="110" height="6" rx="3" fill="#78716c" />
      <rect x="325" y="44" width="70" height="6" rx="3" fill="#78716c" opacity="0.6" />
    </g>
