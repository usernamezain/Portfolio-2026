<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="vsBg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b071a" />
      <stop offset="100%" stop-color="#030208" />
    </linearGradient>
    <linearGradient id="vsAccent" x1="50" y1="50" x2="550" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
