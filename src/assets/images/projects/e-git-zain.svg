<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151f30" />
      <stop offset="100%" stop-color="#0d1422" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Subtle Matrix Grid -->
  <g stroke="#1a273e" stroke-width="1" opacity="0.4">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="150" y1="0" x2="150" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="450" y1="0" x2="450" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="750" y1="0" x2="750" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1050" y1="0" x2="1050" y2="675" />
  </g>

  <!-- Terminal Window Shell -->
  <rect x="120" y="80" width="960" height="515" rx="16" fill="url(#card-grad)" stroke="#223652" stroke-width="2" />

  <!-- Terminal Titlebar -->
  <path d="M 120 96 A 16 16 0 0 1 136 80 L 1064 80 A 16 16 0 0 1 1080 96 L 1080 135 L 120 135 Z" fill="#121b2b" />
  <circle cx="155" cy="108" r="6.5" fill="#ff5f56" />
  <circle cx="178" cy="108" r="6.5" fill="#ffbd2e" />
  <circle cx="201" cy="108" r="6.5" fill="#27c93f" />

  <text x="600" y="113" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="600" fill="#7d93b2" text-anchor="middle">
    bash — e-git v4.0.2 • The Terminal GitHub Companion
  </text>

  <!-- Terminal Header / Title -->
  <text x="170" y="195" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="800" fill="#ffffff">
    ⚡ e-git-zain
  </text>
  <rect x="365" y="172" width="105" height="28" rx="6" fill="#00D9FF" fill-opacity="0.15" stroke="#00D9FF" stroke-width="1.5" />
  <text x="417" y="191" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00D9FF" text-anchor="middle">v4.0.2 npm</text>

  <rect x="480" y="172" width="125" height="28" rx="6" fill="#22C55E" fill-opacity="0.15" stroke="#22C55E" stroke-width="1.5" />
  <text x="542" y="191" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#22C55E" text-anchor="middle">33 tests pass</text>

  <!-- Terminal Body Commands -->
  <text x="170" y="245" font-family="'JetBrains Mono', monospace" font-size="15" fill="#60a5fa">
    $ <tspan fill="#ffffff" font-weight="600">npm install -g e-git-zain</tspan>
  </text>

  <text x="170" y="295" font-family="'JetBrains Mono', monospace" font-size="16" fill="#60a5fa">
    $ <tspan fill="#00D9FF" font-weight="700">e-git</tspan> <tspan fill="#a7f3d0">"feat: integrate autonomous secret scanner shield"</tspan>
  </text>

  <!-- Feature Grid in Terminal -->
  <g transform="translate(170, 335)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="200" height="90" rx="8" fill="#0f1725" stroke="#1f334d" stroke-width="1.5" />
    <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00D9FF">01 • SCAN</text>
    <text x="20" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Secret Leaks Shield</text>
    <text x="20" y="75" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">13 Key Patterns (AWS/JWT)</text>

    <!-- Stage 2 -->
    <rect x="220" y="0" width="200" height="90" rx="8" fill="#0f1725" stroke="#1f334d" stroke-width="1.5" />
    <text x="240" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#22C55E">02 • VERIFY</text>
    <text x="240" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Pre-Push Test &amp; Lint</text>
    <text x="240" y="75" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Zero Manual Setup</text>

    <!-- Stage 3 -->
    <rect x="440" y="0" width="200" height="90" rx="8" fill="#0f1725" stroke="#1f334d" stroke-width="1.5" />
    <text x="460" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#eab308">03 • TRAVEL</text>
    <text x="460" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Push Undo &amp; Redo</text>
    <text x="460" y="75" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Local History Ledger</text>

    <!-- Stage 4 -->
    <rect x="660" y="0" width="200" height="90" rx="8" fill="#0f1725" stroke="#1f334d" stroke-width="1.5" />
    <text x="680" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ec4899">04 • DASHBOARD</text>
    <text x="680" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Interactive TUI Hub</text>
    <text x="680" y="75" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">PRs, Issues &amp; Actions</text>
  </g>

  <!-- Output log footer in Terminal -->
  <rect x="170" y="450" width="860" height="95" rx="8" fill="#080e18" stroke="#16253b" stroke-width="1" />
  <text x="195" y="482" font-family="'JetBrains Mono', monospace" font-size="13" fill="#22C55E">
    ✔ [SHIELD] 0 sensitive keys detected • working tree clean
  </text>
  <text x="195" y="507" font-family="'JetBrains Mono', monospace" font-size="13" fill="#38bdf8">
    ✔ [GIT] Stage → Commit → Push origin main (Hash: 9b2d8fe) [SUCCESS]
  </text>
  <text x="195" y="530" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">
    Run `e-git undo` at any time to rollback remote changes.
  </text>
</svg>
