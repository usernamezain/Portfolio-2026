<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="mdBg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="mdGrad" x1="100" y1="50" x2="500" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="mdGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" rx="12" fill="url(#mdBg)" />

  <!-- 3D Geometric Mesh Wireframe Elements -->
  <g transform="translate(380, 160)">
    <circle cx="0" cy="0" r="85" fill="url(#mdGrad)" opacity="0.2" filter="url(#mdGlow)" />
    <!-- Wireframe Sphere / Icosahedron -->
    <circle cx="0" cy="0" r="75" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="75" ry="30" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="30" ry="75" stroke="rgba(59, 130, 246, 0.5)" stroke-width="1.5" />
    <path d="M-65 -35 L65 35 M-65 35 L65 -35" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="0" cy="0" r="6" fill="#a855f7" />
  </g>

  <!-- Left Content Box -->
  <g transform="translate(60, 80)">
    <rect width="110" height="24" rx="12" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.3)" />
    <text x="55" y="16" font-family="monospace" font-size="10" font-weight="600" fill="#c084fc" text-anchor="middle">WEBGL / 3D</text>

    <text x="0" y="65" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#f4f4f5">
      Mughal.Dev
    </text>
    <text x="0" y="95" font-family="system-ui, sans-serif" font-size="14" fill="#a1a1aa">
      Interactive 3D developer portfolio.
    </text>
    <text x="0" y="118" font-family="system-ui, sans-serif" font-size="14" fill="#a1a1aa">
      Built with React &amp; Three.js canvas.
    </text>

    <rect x="0" y="145" width="130" height="30" rx="6" fill="#27272a" stroke="rgba(255,255,255,0.1)" />
    <text x="65" y="164" font-family="monospace" font-size="11" fill="#e4e4e7" text-anchor="middle">LIVE SHOWCASE ↗</text>
  </g>
</svg>
