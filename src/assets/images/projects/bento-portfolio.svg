<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="bentoBg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <rect width="600" height="340" rx="12" fill="url(#bentoBg)" />

  <!-- Bento Grid Cards Mockup -->
  <g transform="translate(40, 35)">
    <!-- Card 1: Large Feature -->
    <rect x="0" y="0" width="310" height="150" rx="10" fill="#1f2937" stroke="rgba(255,255,255,0.08)" />
    <rect x="20" y="20" width="80" height="18" rx="9" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.4)" />
    <text x="60" y="33" font-family="monospace" font-size="9" fill="#818cf8" font-weight="600" text-anchor="middle">BENTO UI</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f9fafb">
      Mughal Dev Bento
    </text>
    <text x="20" y="92" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">
      Modular card architecture with GSAP physics.
    </text>

    <!-- Card 2: Square Right Top -->
    <rect x="325" y="0" width="195" height="120" rx="10" fill="#1f2937" stroke="rgba(255,255,255,0.08)" />
    <circle cx="360" cy="40" r="16" fill="#374151" />
    <circle cx="360" cy="40" r="8" fill="#10b981" />
    <rect x="390" y="32" width="90" height="8" rx="3" fill="#e5e7eb" />
    <rect x="390" y="46" width="60" height="6" rx="3" fill="#9ca3af" />
    <rect x="345" y="75" width="155" height="24" rx="6" fill="#111827" />

    <!-- Card 3: Wide Bottom Left -->
    <rect x="0" y="165" width="220" height="105" rx="10" fill="#1f2937" stroke="rgba(255,255,255,0.08)" />
    <rect x="20" y="185" width="100" height="10" rx="3" fill="#ec4899" opacity="0.8" />
    <rect x="20" y="205" width="180" height="6" rx="3" fill="#6b7280" />
    <rect x="20" y="218" width="140" height="6" rx="3" fill="#6b7280" />

    <!-- Card 4: Bottom Right -->
    <rect x="235" y="135" width="285" height="135" rx="10" fill="#1f2937" stroke="rgba(255,255,255,0.08)" />
    <rect x="255" y="160" width="110" height="10" rx="3" fill="#3b82f6" />
    <rect x="255" y="180" width="240" height="6" rx="3" fill="#9ca3af" />
    <rect x="255" y="195" width="190" height="6" rx="3" fill="#9ca3af" />
    <rect x="255" y="215" width="120" height="26" rx="6" fill="#374151" />
  </g>
</svg>

