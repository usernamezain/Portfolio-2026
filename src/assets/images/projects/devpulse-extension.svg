<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="dpBg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="dpAccent" x1="50" y1="50" x2="550" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="dpGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="600" height="340" rx="12" fill="url(#dpBg)" />
  <rect width="600" height="340" rx="12" fill="url(#dpGrid)" />

  <!-- Mockup Chrome Extension Popup Window -->
  <rect x="40" y="36" width="520" height="268" rx="8" fill="#0f172a" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1" />
  
