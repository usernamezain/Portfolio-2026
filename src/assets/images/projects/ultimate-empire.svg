<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="ueBg" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ueAccent" x1="50" y1="50" x2="550" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <pattern id="ueGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="600" height="340" rx="12" fill="url(#ueBg)" />
  <rect width="600" height="340" rx="12" fill="url(#ueGrid)" />

  <!-- Mockup Window Browser Frame -->
  <rect x="40" y="36" width="520" height="268" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  
  <!-- Window Header -->
  <path d="M40 36H560V64H40V36Z" fill="#0f172a" />
  <circle cx="60" cy="50" r="4" fill="#ef4444" />
  <circle cx="74" cy="50" r="4" fill="#eab308" />
  <circle cx="88" cy="50" r="4" fill="#22c55e" />
  <rect x="110" y="44" width="160" height="12" rx="6" fill="#334155" opacity="0.6" />

  <!-- Window Content -->
  <!-- Header Title -->
  <rect x="70" y="90" width="180" height="14" rx="4" fill="url(#ueAccent)" />
  <rect x="70" y="114" width="280" height="8" rx="3" fill="#94a3b8" opacity="0.6" />
  <rect x="70" y="128" width="220" height="8" rx="3" fill="#94a3b8" opacity="0.4" />

  <!-- Growth Chart Visual -->
  <g transform="translate(70, 160)">
    <rect width="460" height="110" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.06)" />
    <!-- Chart Grid Lines -->
    <line x1="20" y1="30" x2="440" y2="30" stroke="rgba(255,255,255,0.05)" />
    <line x1="20" y1="60" x2="440" y2="60" stroke="rgba(255,255,255,0.05)" />
    <line x1="20" y1="90" x2="440" y2="90" stroke="rgba(255,255,255,0.05)" />
    <!-- Graph Curve -->
    <path d="M20 85 Q 120 70, 200 45 T 340 30 T 440 15" fill="none" stroke="url(#ueAccent)" stroke-width="3" stroke-linecap="round" />
    <circle cx="440" cy="15" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- Tag Pill -->
  <rect x="420" y="85" width="110" height="24" rx="12" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.3)" />
  <text x="475" y="101" font-family="monospace" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">GROWTH COURSE</text>
</svg>

