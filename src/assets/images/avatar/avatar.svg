<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ea8fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" rx="100" fill="url(#bgGrad)" />

  <!-- Subtle Tech Concentric Rings -->
  <circle cx="100" cy="100" r="92" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="4 6" />
  <circle cx="100" cy="100" r="76" stroke="rgba(110, 168, 254, 0.2)" stroke-width="1.5" />

  <!-- Glowing Accent Core -->
  <circle cx="100" cy="100" r="54" fill="url(#accentGrad)" opacity="0.15" filter="url(#glow)" />
  <circle cx="100" cy="100" r="48" stroke="url(#accentGrad)" stroke-width="2" />

  <!-- Modern Geometric Monogram "ZM" -->
  <path d="M72 74H102L76 122H106" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M106 122V74L122 100L138 74V122" stroke="#f5f5f5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Status Online Dot -->
  <circle cx="152" cy="152" r="12" fill="#09090b" stroke="#18181b" stroke-width="3" />
  <circle cx="152" cy="152" r="7" fill="#22c55e" />
</svg>
